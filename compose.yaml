name: controlled

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controlled}
      POSTGRES_USER: ${POSTGRES_USER:-controlled}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controlled-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://controlled:controlled-local-only@postgres:5432/controlled?sslmode=disable}
      CONTROLLED_HTTP_ADDR: :8080
      CONTROLLED_LOG_LEVEL: ${CONTROLLED_LOG_LEVEL:-INFO}
      CONTROLLED_SHUTDOWN_TIMEOUT: ${CONTROLLED_SHUTDOWN_TIMEOUT:-10s}
      CONTROLLED_DB_PING_TIMEOUT: ${CONTROLLED_DB_PING_TIMEOUT:-5s}
      CONTROLLED_DB_MAX_CONNS: ${CONTROLLED_DB_MAX_CONNS:-10}
      CONTROLLED_DB_MIN_CONNS: ${CONTROLLED_DB_MIN_CONNS:-1}
      CONTROLLED_GOOGLE_CLIENT_ID: ${CONTROLLED_GOOGLE_CLIENT_ID:-376706277927-s4mest4okp2a4par7m6tl69b9ut3rl7c.apps.googleusercontent.com}
      CONTROLLED_CUSTODY_PROVIDER: ${CONTROLLED_CUSTODY_PROVIDER:-fake}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_RETURN_URL: ${PAYPAL_RETURN_URL:-https://example.com/paypal/return}
      PAYPAL_CANCEL_URL: ${PAYPAL_CANCEL_URL:-https://example.com/paypal/cancel}
      CONTROLLED_AI_PROVIDER: ${CONTROLLED_AI_PROVIDER:-disabled}
      CONTROLLED_AI_BASE_URL: ${CONTROLLED_AI_BASE_URL:-https://openrouter.ai/api/v1}
      CONTROLLED_AI_MODEL: ${CONTROLLED_AI_MODEL:-}
      CONTROLLED_AI_API_KEY: ${CONTROLLED_AI_API_KEY:-}
      CONTROLLED_AI_TIMEOUT: ${CONTROLLED_AI_TIMEOUT:-8s}
      CONTROLLED_AI_REQUIRE_PARAMETERS: ${CONTROLLED_AI_REQUIRE_PARAMETERS:-true}
      CONTROLLED_EXPO_PUSH_URL: ${CONTROLLED_EXPO_PUSH_URL:-https://exp.host/--/api/v2/push/send}
      CONTROLLED_EXPO_ACCESS_TOKEN: ${CONTROLLED_EXPO_ACCESS_TOKEN:-}
      CONTROLLED_EXPO_PUSH_TIMEOUT: ${CONTROLLED_EXPO_PUSH_TIMEOUT:-5s}
      CHANNEL3_API_BASE: ${CHANNEL3_API_BASE:-https://api.trychannel3.com/v1}
      CHANNEL3_API_KEY: ${CHANNEL3_API_KEY:-}
      CHANNEL3_TIMEOUT: ${CHANNEL3_TIMEOUT:-4s}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CONTROLLED_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:

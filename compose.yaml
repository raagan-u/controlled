name: paypact

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paypact}
      POSTGRES_USER: ${POSTGRES_USER:-paypact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paypact-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://paypact:paypact-local-only@postgres:5432/paypact?sslmode=disable}
      PAYPACT_HTTP_ADDR: :8080
      PAYPACT_LOG_LEVEL: ${PAYPACT_LOG_LEVEL:-INFO}
      PAYPACT_SHUTDOWN_TIMEOUT: ${PAYPACT_SHUTDOWN_TIMEOUT:-10s}
      PAYPACT_DB_PING_TIMEOUT: ${PAYPACT_DB_PING_TIMEOUT:-5s}
      PAYPACT_DB_MAX_CONNS: ${PAYPACT_DB_MAX_CONNS:-10}
      PAYPACT_DB_MIN_CONNS: ${PAYPACT_DB_MIN_CONNS:-1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PAYPACT_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
